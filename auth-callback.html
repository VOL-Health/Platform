<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOL Health | Create Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#070b16; --border:rgba(255,255,255,0.11); --text:#eef4ff; --muted:rgba(255,255,255,0.70); --green:#35c67a; --green-2:#7ce7b5; --red:#ff7b7b; --blue:#8fd7ff; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; font-family:Montserrat,Inter,Arial,sans-serif; background:radial-gradient(circle at 16% 0%, rgba(44,108,255,0.18), transparent 32%), radial-gradient(circle at 86% 10%, rgba(53,198,122,0.13), transparent 28%), linear-gradient(180deg,#080d1b 0%,var(--bg) 58%,#050814 100%); color:var(--text); }
    a{ color:inherit; text-decoration:none; }
    button,input{ font:inherit; }
    .shell{ width:min(760px, calc(100% - 32px)); margin:18px auto 42px; }
    .header{ display:flex; align-items:center; justify-content:space-between; gap:18px; padding:14px 0 28px; }
    .logo{ display:inline-flex; align-items:center; gap:0.08em; font-size:clamp(30px,4vw,48px); font-weight:300; letter-spacing:0.08em; line-height:1; color:rgba(255,255,255,0.94); white-space:nowrap; }
    .logo-o{ width:0.76em; height:0.76em; border-radius:50%; border:0.065em solid #4f82ff; display:inline-block; transform:translateY(0.035em); }
    .nav-pill{ padding:9px 13px; border-radius:999px; border:1px solid var(--border); background:rgba(255,255,255,0.045); color:rgba(255,255,255,0.76); font-size:11px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase; }
    .panel{ border:1px solid var(--border); border-radius:18px; background:rgba(13,18,36,0.78); padding:clamp(22px,4vw,36px); box-shadow:0 18px 50px rgba(0,0,0,0.34); }
    .eyebrow{ color:var(--blue); font-size:11px; font-weight:900; letter-spacing:0.13em; text-transform:uppercase; }
    h1{ margin:12px 0 10px; font-size:clamp(28px,4vw,42px); line-height:1.1; }
    p{ margin:0; color:var(--muted); line-height:1.65; }
    form{ display:grid; gap:14px; margin-top:24px; max-width:520px; }
    label{ display:grid; gap:8px; color:rgba(255,255,255,0.72); font-size:12px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
    input{ width:100%; border:1px solid rgba(255,255,255,0.12); border-radius:12px; background:rgba(255,255,255,0.055); color:#fff; padding:13px 14px; outline:none; }
    input:focus{ border-color:rgba(53,198,122,0.55); box-shadow:0 0 0 3px rgba(53,198,122,0.11); }
    button{ justify-self:start; border:1px solid rgba(53,198,122,0.66); border-radius:999px; padding:11px 16px; background:linear-gradient(135deg,var(--green),var(--green-2)); color:#06111d; font-weight:900; cursor:pointer; }
    button:disabled{ cursor:wait; opacity:0.62; }
    .state{ display:grid; gap:12px; margin-top:16px; }
    .status{ color:var(--muted); }
    .error{ color:#230909; background:var(--red); border-radius:12px; padding:12px 14px; font-weight:700; }
    .notice{ color:#07131c; background:linear-gradient(135deg,var(--green),var(--green-2)); border-radius:12px; padding:12px 14px; font-weight:800; }
    @media (max-width:640px){ .header{ align-items:flex-start; flex-direction:column; } .shell{ width:min(760px, calc(100% - 20px)); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/+esm"
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a href="/" aria-label="VOL Health home">
        <div class="logo"><span>V</span><span class="logo-o"></span><span>L</span><span style="width:0.26em"></span><span>H</span><span>E</span><span>A</span><span>L</span><span>T</span><span>H</span></div>
      </a>
      <a class="nav-pill" href="/auth-proof">Community Access</a>
    </header>

    <main class="panel">
      <div class="eyebrow">VOL Health Access</div>
      <h1>Create your VOL Health password.</h1>
      <p>Choose a password to finish setting up access to your community view.</p>

      <form data-password-form hidden>
        <label>New password
          <input data-password type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>Confirm password
          <input data-confirm-password type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button data-submit-button type="submit">Save password</button>
      </form>

      <div class="state" aria-live="polite">
        <div class="status" data-status>Preparing password setup...</div>
        <div class="notice" data-notice hidden></div>
        <div class="error" data-error hidden></div>
      </div>
    </main>
  </div>

  <script type="module" src="/auth-callback.js"></script>
</body>
</html>
